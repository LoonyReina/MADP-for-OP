[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendop-tester-daemon"
version = "3.0.0"
description = "AscendOP Flow V3 control plane"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ascendop-protocol==3.0.0"]

[project.scripts]
ascendop-daemon = "ascendop_daemon.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
