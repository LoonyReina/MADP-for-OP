[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limited-remote-partner"
version = "0.1.0"
description = "Git synchronized remote command runner with bounded result files"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ascendop-protocol==3.0.0"]

[project.scripts]
git-partner = "limited_remote_partner.cli.partner:main"
limited-remote-partner = "limited_remote_partner.cli.main:main"
git-partner-server = "limited_remote_partner.gateway.server:main"
git-partner-client = "limited_remote_partner.gateway.client:main"
git-partner-init-relay = "limited_remote_partner.gateway.init_relay:main"
git-partner-submit = "limited_remote_partner.gateway.submit_job:main"
git-partner-local-sync = "limited_remote_partner.gateway.local_sync:main"
git-partner-output-sync = "limited_remote_partner.gateway.local_sync:main"
git-partner-lan-ops = "limited_remote_partner.maintenance.lan_ops:main"
git-partner-test-engine = "limited_remote_partner.cli.test_engine_cli:main"
git-partner-relay-status = "limited_remote_partner.observability.relay_status:main"
git-partner-endpoints = "limited_remote_partner.cli.endpoint_cli:main"
git-partner-node-service = "limited_remote_partner.endpoint.node_service:main"
git-partner-enroll-materialized = "limited_remote_partner.cli.enroll_materialized:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["input", "output", "exchange", "work", ".partner_state"]
