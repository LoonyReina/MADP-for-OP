[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendop-protocol"
version = "3.0.0"
description = "Shared immutable contracts for AscendOP Flow V3"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ascendop_protocol = ["schemas/*.json", "schemas/examples/*.json"]
