[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendop-tester-daemon"
version = "4.5.0"
description = "Public control-plane slice of the MADP daemon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["ascendop-protocol==4.5.0", "ascendop-control==4.5.0"]

[tool.setuptools.packages.find]
where = ["src"]
