[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendop-test-gateway"
version = "5.6.0a1"
description = "MADP generic evaluation gateway runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["ascendop-protocol==5.6.0a1"]

[tool.setuptools.packages.find]
where = ["src"]
